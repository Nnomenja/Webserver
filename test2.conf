server:
    port 2000

    error_page 404 /errors/404.html
    error_page 500 /errors/500.html

    client_max_body_size 10M

    location:
        path /
        root www
        index index.html
        methods GET POST
        autoindex off

    location:
        path /test
        root www/test
        index index.html
        methods GET
        autoindex on

    location:
        path /upload
        root www/uploads
        methods POST
        upload_enable on
        upload_store uploads

    location:
        path /redirect
        return 301 http://example.com

    location:
        path /cgi
        root www/cgi
        methods GET POST
        cgi_extension .py
        cgi_path /usr/bin/python3


server:
    port 2001

    error_page 404 /errors/404.html

    client_max_body_size 5M

    location:
        path /
        root www
        index index.html
        methods GET
        autoindex off