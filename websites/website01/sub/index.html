<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-top: 20px;
        }
        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            margin-top: 30px;
            width: 400px;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }
        form input[type="file"] {
            padding: 5px;
            border-radius: 5px;
            border: none;
        }
        form input[type="submit"] {
            margin-top: 15px;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background-color: #22c55e;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        form input[type="submit"]:hover {
            background-color: #16a34a;
        }
        img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="nav">
        <a href="/">Home</a>
        <a href="cat.html">Cat</a>
    </div>

    <div class="card">
        <h1>Hello world</h1>
        <img src="sub/images.jpeg" alt="cat">
        <form action="/" method="post" enctype="multipart/form-data">
            <label for="file">Choose file:</label><br><br>
            <input type="file" id="file" name="file" required><br><br>
            <input type="submit" value="Upload">
        </form>
    </div>

</body>
</html>
